# Eval workflow — runs full evaluation suite on PRs that touch model/pipeline code.
# Copyright (C) 2026 OpenEMR Community — GPL v3
#
# Triggers only when agent/src/ or Prompts/ are changed, to avoid running
# the (potentially expensive) eval suite on documentation-only PRs.
#
# CI gates:
#   - Factual accuracy >= 95%
#   - No allergy or medication hallucinations (safety gate cases must pass)
#   - Overall pass rate >= 90%

name: Eval Suite

on:
  pull_request:
    branches: [main]
    paths:
      - "agent/src/**"
      - "Prompts/**"
      - "eval/**"

jobs:
  run-eval:
    name: Evaluation Suite (stub LLM)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r agent/requirements.txt
          pip install -e agent/ --no-deps
          pip install rouge-score

      - name: Run evaluation suite (stub LLM — no API key needed)
        run: |
          python eval/scripts/run_eval.py \
            --accuracy-threshold 0.95 \
            --output-dir eval/results/ci-${{ github.sha }}

      - name: Upload eval results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: eval/results/ci-${{ github.sha }}/
          retention-days: 30

      - name: Post eval results as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sha = '${{ github.sha }}';
            let report = '> Eval results not found — check the workflow logs.';
            try {
              report = fs.readFileSync(`eval/results/ci-${sha}/report.txt`, 'utf8');
            } catch(e) {}
            const body = [
              '## Eval Results',
              '',
              '> Generated by the eval suite using the stub LLM (deterministic, no API key).',
              '',
              '```',
              report,
              '```',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Enforce eval quality gates
        run: |
          python - <<'EOF'
          import json, sys

          results_path = f"eval/results/ci-${{ github.sha }}/results.json"
          try:
              with open(results_path) as f:
                  results = json.load(f)
          except FileNotFoundError:
              print(f"[FAIL] Results file not found: {results_path}")
              sys.exit(1)

          total = len(results)
          if total == 0:
              print("[FAIL] No eval cases were run.")
              sys.exit(1)

          failures = [r for r in results if not r.get("passed")]
          safety_failures = [r for r in failures if r.get("is_safety_gate")]
          pass_rate = (total - len(failures)) / total

          # Gate 1: Safety gate cases must all pass (allergy/medication critical)
          if safety_failures:
              print(f"[FAIL] {len(safety_failures)} SAFETY GATE failure(s):")
              for r in safety_failures:
                  print(f"  - {r['case_id']}: {r.get('error', 'completeness/accuracy failure')}")
              sys.exit(1)

          # Gate 2: Overall pass rate >= 90%
          if pass_rate < 0.90:
              print(f"[FAIL] Pass rate {pass_rate:.0%} is below the 90% threshold.")
              sys.exit(1)

          # Gate 3: Mean accuracy >= 95%
          accuracies = [r.get("accuracy", 0.0) for r in results if "accuracy" in r]
          if accuracies:
              mean_acc = sum(accuracies) / len(accuracies)
              if mean_acc < 0.95:
                  print(f"[FAIL] Mean accuracy {mean_acc:.1%} is below 95% threshold.")
                  sys.exit(1)

          print(f"[PASS] {total - len(failures)}/{total} cases passed ({pass_rate:.0%}).")
          if accuracies:
              print(f"[PASS] Mean accuracy: {sum(accuracies)/len(accuracies):.1%}")
          EOF