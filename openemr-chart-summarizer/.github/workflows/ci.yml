# CI workflow — runs on every pull request and push to main.
# Copyright (C) 2026 OpenEMR Community — GPL v3

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Python: lint + type check
  # -------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type Check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy pydantic pydantic-settings fastapi

      - name: Ruff lint
        run: ruff check agent/src/

      - name: Mypy type check
        run: mypy agent/src/ --ignore-missing-imports --no-strict-optional

  # -------------------------------------------------------------------------
  # Python: unit tests (excluding eval/ which requires real LLM keys)
  # -------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r agent/requirements.txt
          pip install -e agent/ --no-deps

      - name: Run unit tests
        run: |
          pytest agent/tests/unit/ -v --tb=short -x \
            --ignore=agent/tests/eval/

  # -------------------------------------------------------------------------
  # PHP: syntax check all module files
  # -------------------------------------------------------------------------
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: PHP syntax check
        run: |
          ERRORS=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null 2>&1 || { echo "Syntax error: $file"; ERRORS=$((ERRORS+1)); }
          done < <(find module/ -name "*.php" -print0)
          if [ "$ERRORS" -gt 0 ]; then
            echo "PHP lint failed with $ERRORS error(s)"
            exit 1
          fi
          echo "PHP lint passed (all files OK)"

  # -------------------------------------------------------------------------
  # Security: scan Python dependencies for known CVEs
  # -------------------------------------------------------------------------
  security-scan:
    name: Security Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # Continue on error — treat as advisory; pin-and-patch policy applies.
        run: pip-audit -r agent/requirements.txt --progress-spinner off || true

  # -------------------------------------------------------------------------
  # Docker: verify the image builds (no push — push only on release tags)
  # -------------------------------------------------------------------------
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (multi-stage, verify only)
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          push: false
          tags: chart-summarizer-agent:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max